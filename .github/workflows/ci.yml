name: SMART SMS CI/CD Pipeline

on:
  push:
    branches: [ Main, prod, master ]
  pull_request:
    branches: [ Main, prod, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Execute Database Migrations
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: smart_sms_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/smart_sms_test
        run: npm run migrate:up

      - name: Run Backend Integration & Unit Tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: smart_sms_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/smart_sms_test
          JWT_SECRET: ci_test_jwt_secret_must_be_long_enough_for_security_12345
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_must_be_long_enough_12345
          REDIS_URL: redis://localhost:6379
        run: npm test

  frontend-build:
    name: Frontend Turbopack & Standalone Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Verify Standalone Output Bundle
        working-directory: frontend
        run: test -f .next/standalone/server.js && echo "Standalone server bundle verified!"
