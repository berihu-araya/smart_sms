services:
  nginx:
    image: nginx:alpine
    container_name: smart_sms_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - smart_sms_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_sms_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=smart_sms_prod
      - JWT_SECRET=production_secret_change_me_before_deploy
      - JWT_REFRESH_SECRET=production_refresh_secret_change_me
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smart_sms_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_sms_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    networks:
      - smart_sms_net

  db:
    image: postgres:17-alpine
    container_name: smart_sms_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smart_sms_prod
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_sms_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_sms_net

  redis:
    image: redis:7-alpine
    container_name: smart_sms_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - smart_sms_net

volumes:
  db_data:
  redis_data:

networks:
  smart_sms_net:
    driver: bridge
