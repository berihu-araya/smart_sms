services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_sms_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5200
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    ports:
      - "5200:5200"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: smart_sms_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: smart_sms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
    name: smart_sms_db_data
  redis_data:
    name: smart_sms_redis_data